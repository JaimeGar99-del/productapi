<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — DummyJSON</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Productos <span>.</span></h1>
  <span class="meta-tag" id="total-badge">cargando…</span>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search-input" type="text" placeholder="Buscar productos…">
  </div>
  <select id="limit-select">
    <option value="10">10 por página</option>
    <option value="20" selected>20 por página</option>
    <option value="30">30 por página</option>
  </select>
</div>

<div class="info-bar" id="info-bar">Cargando productos…</div>

<main>
  <div id="grid" class="grid"></div>
</main>

<div class="pagination" id="pagination"></div>

<script src="app.js"></script>
</body>
</html>
